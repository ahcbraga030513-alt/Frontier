<style>
/* Layout: cabeçalho com totais, abas por sistema, tabelas e cartões com filtros. */
:root{
  --bg:#f3efe6; --surface:#fbf9f3; --ink:#1d1a15; --dim:#6d6657; --line:#d9d1bf;
  --ember:#b8561a; --moss:#4c6d22; --water:#1f6b88; --blood:#a63a28;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12100d;--surface:#1b1814;--ink:#ece3cf;--dim:#a39b87;--line:#35302a;--ember:#ee8a3c;--moss:#9cc15f;--water:#6fb4cf;--blood:#d2573f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12100d;--surface:#1b1814;--ink:#ece3cf;--dim:#a39b87;--line:#35302a;--ember:#ee8a3c;--moss:#9cc15f;--water:#6fb4cf;--blood:#d2573f;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:22px}
.wrap>*{min-width:0}
h1{margin:0;font:700 clamp(36px,7vw,60px)/.95 var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h1 small{display:block;font-size:.34em;letter-spacing:.34em;color:var(--ember);margin-bottom:8px}
.lead{margin:0;max-width:64ch;color:var(--dim)}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.totals div{padding:12px 16px;border-right:1px solid var(--line);display:grid;gap:0}
.totals div:last-child{border-right:0}
.totals b{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.totals span{font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.totals em{font:normal 12px var(--body);color:var(--moss)}
nav{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
nav a{font:600 15px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-decoration:none;padding:7px 14px;border-radius:5px;border:1px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--ember);background:var(--surface)}
nav a:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{font:inherit;padding:7px 12px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;flex:1 1 200px;max-width:320px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;color:var(--dim);width:42px}
td b{font:700 17px var(--display);letter-spacing:.03em}
td small{display:block;color:var(--dim);font-size:13px}
tr.grp td{background:var(--bg);font:700 15px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ember);padding:8px 12px}
.st{font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.st.jogavel{color:var(--moss);border-color:var(--moss)} .st.parcial{color:var(--ember);border-color:var(--ember)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.card h3{margin:0;font:700 22px/1.1 var(--display);letter-spacing:.03em}
.card h3 small{display:block;font:600 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ember);margin-bottom:3px}
.card p{margin:0;color:var(--dim);font-size:14px}
.card dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.card dt{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-top:1px}
.card dd{margin:0}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:start}
.lv{font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase}
.lv.I{color:var(--moss)} .lv.M{color:var(--water)} .lv.A{color:var(--ember)} .lv.L{color:var(--blood)} .lv.X{color:var(--ink);text-decoration:underline}
.legend{color:var(--dim);font-size:13px;margin:0}

</style>

<script>
(function(){
const C=CATALOG,$=s=>document.querySelector(s);
const catName={pacifica:'Pacíficas e domesticáveis',predador:'Predadores',hostil:'Monstros hostis',voadora:'Voadoras',magica:'Mágicas e elementais',elite:'Elites raras'};
const dimName=id=>(C.dims.find(d=>d.id===id)||{}).nome||'';
const stLabel={jogavel:'Jogável',parcial:'Parcial',planejado:'Planejado'};
const st=s=>`<span class="st ${s}">${stLabel[s]}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tabs=[['mobs','Mobs'],['chefoes','Chefões'],['dimensoes','Dimensões'],['masmorras','Masmorras'],['progressao','Progressão']];
const state={tab:'mobs',cat:'todos',dim:0,lv:'todos',q:''};
const cnt=(a,f)=>a.filter(f).length;
$('#totals').innerHTML=[
 [C.mobs.length,'Mobs',cnt(C.mobs,m=>m.status==='jogavel')+' jogáveis'],
 [C.bosses.length,'Chefões',cnt(C.bosses,m=>m.status==='jogavel')+' jogável'],
 [C.dims.length,'Dimensões',cnt(C.dims,m=>m.status!=='planejado')+' em andamento'],
 [C.dungeons.length,'Masmorras',cnt(C.dungeons,m=>m.status==='jogavel')+' jogável']
].map(t=>`<div><b>${t[0]}</b><span>${t[1]}</span><em>${t[2]}</em></div>`).join('');
function nav(){$('#nav').innerHTML=tabs.map(t=>`<a href="#${t[0]}" ${state.tab===t[0]?'aria-current="page"':''}>${t[1]}</a>`).join('')}
function chips(list,key,all){return list.map(c=>`<button class="chip" data-k="${key}" data-v="${c[0]}" aria-pressed="${String(state[key])===String(c[0])}">${c[1]}</button>`).join('')}
function tools(){
  const t=state.tab,box=$('#tools');let h='';
  if(t==='mobs')h=chips([['todos','Todos'],...Object.entries(catName)],'cat')+'<input type="search" id="q" placeholder="Buscar mob" aria-label="Buscar mob" value="'+esc(state.q)+'">';
  else if(t==='masmorras')h='<label class="legend" for="dimSel">Dimensão</label><select id="dimSel" class="chip" style="text-transform:none">'+[[0,'Todas'],...C.dims.map(d=>[d.id,d.id+'. '+d.nome])].map(d=>`<option value="${d[0]}" ${+state.dim===+d[0]?'selected':''}>${esc(d[1])}</option>`).join('')+'</select>'+chips([['todos','Todos os níveis'],...Object.entries(C.LV)],'lv')+'<input type="search" id="q" placeholder="Buscar masmorra" aria-label="Buscar masmorra" value="'+esc(state.q)+'">';
  box.innerHTML=h;box.hidden=!h;
  box.querySelectorAll('.chip[data-k]').forEach(b=>b.addEventListener('click',()=>{state[b.dataset.k]=b.dataset.k==='dim'?+b.dataset.v:b.dataset.v;render()}));
  const q=$('#q');if(q)q.addEventListener('input',e=>{state.q=e.target.value;body()});
  const ds=$('#dimSel');if(ds)ds.addEventListener('change',e=>{state.dim=+e.target.value;body()});
}
function mobsView(){
  const q=state.q.toLowerCase();const rows=C.mobs.filter(m=>(state.cat==='todos'||m.cat===state.cat)&&(!q||(m.nome+m.drops+m.comportamento).toLowerCase().includes(q)));
  return `<div class="scroll"><table><thead><tr><th>#</th><th>Mob</th><th>Dimensão</th><th>Vida · Dano · Vel.</th><th>Fraqueza</th><th>Drops e utilidade</th><th>Estado</th></tr></thead><tbody>`+
  rows.map(m=>`<tr><td class="n">${m.n}</td><td><b>${esc(m.nome)}</b><small>${catName[m.cat]}</small><small>${esc(m.comportamento)}</small></td><td>${m.dim}. ${esc(dimName(m.dim))}</td><td style="white-space:nowrap">${m.vida} · ${m.dano} · ${m.vel}</td><td>${esc(m.fraqueza)}</td><td>${esc(m.drops)}<small>${esc(m.uso)}</small></td><td>${st(m.status)}</td></tr>`).join('')+`</tbody></table></div><p class="legend">${rows.length} de ${C.mobs.length} mobs. Vida e dano são valores base; vel. em metros por segundo.</p>`;
}
function bossView(){
  return '<div class="cards">'+C.bosses.map(b=>`<article class="card"><div class="head"><h3><small>Chefão ${b.n} · ${esc(b.elemento)}</small>${esc(b.nome)}</h3>${st(b.status)}</div><p>${esc(b.aparencia)}</p><dl><dt>Dimensão</dt><dd>${b.dim}. ${esc(dimName(b.dim))}</dd><dt>Arena</dt><dd>${esc(b.arena)}</dd><dt>Poderes</dt><dd>${esc(b.poderes)}</dd><dt>Mecânica</dt><dd>${esc(b.mecanica)}</dd><dt>Vida</dt><dd>${b.vida.toLocaleString('pt-BR')} em ${b.fases} fases</dd><dt>Recompensa</dt><dd>${esc(b.recompensa)}</dd></dl></article>`).join('')+'</div>';
}
function dimView(){
  return '<div class="cards">'+C.dims.map(d=>`<article class="card"><div class="head"><h3><small>Dimensão ${d.id}</small>${esc(d.nome)}</h3>${st(d.status)}</div><dl><dt>Acesso</dt><dd>${esc(d.acesso)}</dd><dt>Exclusivo</dt><dd>${esc(d.exclusivo)}</dd><dt>Perigo</dt><dd>${esc(d.perigo)}</dd><dt>Física</dt><dd>${esc(d.fisica)}</dd><dt>Base</dt><dd>${esc(d.base)}</dd><dt>Masmorras</dt><dd>${cnt(C.dungeons,x=>x.dim===d.id)}</dd><dt>Chefão</dt><dd>${esc((C.bosses.find(b=>b.dim===d.id)||{nome:'Nenhum'}).nome)}</dd></dl></article>`).join('')+'</div>';
}
function dunView(){
  const q=state.q.toLowerCase();let last=0,n=0;
  const rows=C.dungeons.filter(d=>(!state.dim||d.dim===state.dim)&&(state.lv==='todos'||d.lv===state.lv)&&(!q||(d.nome+d.desafio+d.classe).toLowerCase().includes(q)));
  let h=`<div class="scroll"><table><thead><tr><th>#</th><th>Masmorra</th><th>Formato</th><th>Nível</th><th>Desafio final</th><th>Caminho por classe</th><th>Estado</th></tr></thead><tbody>`;
  for(const d of rows){if(d.dim!==last){last=d.dim;h+=`<tr class="grp"><td colspan="7">${d.dim}. ${esc(dimName(d.dim))}</td></tr>`}n++;
    h+=`<tr><td class="n">${d.n}</td><td><b>${esc(d.nome)}</b></td><td>${esc(d.formato)}</td><td><span class="lv ${d.lv}">${d.nivel}</span></td><td>${esc(d.desafio)}</td><td>${esc(d.classe)}</td><td>${st(d.status)}</td></tr>`}
  return h+`</tbody></table></div><p class="legend">${n} de ${C.dungeons.length} masmorras: 5 por dimensão nas dimensões 1 a 10 e 4 por dimensão nas dimensões 11 a 20.</p>`;
}
function progView(){
  return `<div class="scroll"><table><thead><tr><th>Níveis</th><th>Equipamento</th><th>Dimensões</th><th>Desafios</th><th>Recompensas</th></tr></thead><tbody>`+C.progressao.map(p=>`<tr><td class="n" style="white-space:nowrap;color:var(--ink)"><b>${p[0]}</b></td><td>${esc(p[1])}</td><td>${esc(p[2])}</td><td>${esc(p[3])}</td><td>${esc(p[4])}</td></tr>`).join('')+`</tbody></table></div><p class="legend">Os níveis são alvos de projeto. A progressão por classe e profissão entra junto das profissões na próxima etapa.</p>`;
}
function body(){const v={mobs:mobsView,chefoes:bossView,dimensoes:dimView,masmorras:dunView,progressao:progView}[state.tab];$('#out').innerHTML=v()}
function render(){nav();tools();body()}
function fromHash(){const h=(location.hash||'').slice(1);if(tabs.some(t=>t[0]===h))state.tab=h;render()}
addEventListener('hashchange',fromHash);fromHash();
})();
</script>
